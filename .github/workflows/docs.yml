# Builds the site on every pull request; publishes it to GitHub Pages from
# master, every day (the Interfaces follow pnut-os's master), and on
# demand.
name: Documentation
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  # A pull request's newer push replaces its build; master's runs wait for
  # the one before, so that a deploy is never stopped half-way
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # git keeps the Overview entry alone between the interfaces markers
      # in zensical.toml: the generator writes the rest at build time
      - run: |
          nav=$(awk '/# interfaces: end/ { f = 0 } f
                     /# interfaces: begin/ { f = 1 }' zensical.toml)
          if [ "$nav" != '    { "Overview" = "interfaces/index.md" },' ]; then
            echo "::error file=zensical.toml::Between the interfaces markers, keep the Overview entry alone; git restore zensical.toml takes out the generated ones"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          repository: pnut-labs/pnut-os
          ref: master
          path: pnut-os
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python tools/proto_pages.py pnut-os docs zensical.toml
      # --strict checks the pages' links, not the nav's: its Interfaces
      # entry needs the generated page
      - run: test -f docs/interfaces/index.md
      - run: zensical build --clean --strict
      # Only master is published, whatever branch a run was started on
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
