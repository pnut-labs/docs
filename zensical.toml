# pnut-os's developer documentation, built with Zensical
# (https://zensical.org). Build: see README.md.

[project]
site_name = "pnut-os"
site_description = "Developer documentation of pnut-os, a phone OS on NuttX"
site_url = "https://pnut-labs.github.io/docs/"
repo_url = "https://github.com/pnut-labs/docs"
repo_name = "pnut-labs/docs"
edit_uri = "edit/master/docs/"
extra_css = ["stylesheets/extra.css"]
copyright = "Copyright 2026 Mateusz Pianka — Apache-2.0"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Building" = "getting-started/building.md" },
    { "Flashing" = "getting-started/flashing.md" },
    { "The shell over serial" = "getting-started/shell.md" },
    { "adb over Wi-Fi" = "getting-started/adb.md" },
  ] },
  { "Device and tooling traps" = "traps.md" },
  { "Writing these docs" = "writing.md" },
  { "Interfaces" = [
  # interfaces: begin (tools/proto_pages.py)
    { "Overview" = "interfaces/index.md" },
  # interfaces: end
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols.fractions = false
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
